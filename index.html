<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zegar iPad</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    .screen {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      text-align: center;
    }

    #clock {
      font-size: 18vw;
      max-width: 95vw;
      font-weight: 200;
      letter-spacing: -3px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    #date {
      margin-top: 30px;
      text-align: center;
      font-size: 4vw;
      line-height: 1.2;
      font-weight: 300;
    }
  </style>
</head>

<body>

  <div class="screen">

    <div class="center">
      <div id="clock">00:00</div>
      <div id="date">poniedziałek, 1 stycznia</div>
    </div>

  </div>

  <script>
    function updateClock() {
      const now = new Date();

      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");

      document.getElementById("clock").textContent =
        hours + ":" + minutes;

      const days = [
        "niedziela",
        "poniedziałek",
        "wtorek",
        "środa",
        "czwartek",
        "piątek",
        "sobota"
      ];

      const months = [
        "stycznia",
        "lutego",
        "marca",
        "kwietnia",
        "maja",
        "czerwca",
        "lipca",
        "sierpnia",
        "września",
        "października",
        "listopada",
        "grudnia"
      ];

      document.getElementById("date").textContent =
        days[now.getDay()] +
        ", " +
        now.getDate() +
        " " +
        months[now.getMonth()];
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
