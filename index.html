<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zegar iPad</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background:
        radial-gradient(circle at 50% 45%, #302044 0%, #21152f 38%, #120d1c 100%);

        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    body {
      position: relative;
    }

    .screen {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* GŁÓWNY ZEGAR */

    .clock-area {
      position: absolute;
      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      text-align: center;
      width: 100%;
    }

    #clock {
      font-size: 18vw;
      max-width: 95vw;

      font-weight: 200;

      line-height: 1;

    #date {
      margin-top: 30px;

      text-align: center;

      font-weight: 300;

      opacity: 0.72;
    }

    .seconds {
      opacity: 0.35;
    }

    /* LEWY GÓRNY */

    .quote {
      position: absolute;

      top: 5%;

      opacity: 0.72;

    /* PRAWY GÓRNY */

    .weather {
      position: absolute;

<body>

  <div class="screen">

    <!-- LEWY GÓRNY -->
    <div class="quote">
      good things take time &lt;3
    </div>

    <!-- PRAWY GÓRNY -->
    <div class="weather">
      <div id="weather-temp">☁︎ --°</div>
      <div id="weather-text">pogoda</div>
    </div>

    <!-- ZEGAR -->
    <div class="clock-area">

      <div id="clock">
        <span id="hours">00</span>:<span id="minutes">00</span><span class="seconds">:<span id="seconds">00</span></span>
      </div>

      <div id="date">
        ładowanie daty...
      </div>

    </div>

    <!-- LEWY DOLNY -->
    <div class="live">
      <div class="flower">🌸</div>
      <div>zegar . live</div>
    </div>

    <!-- DÓŁ ŚRODEK -->
    <div class="message">
      <div>dobrze, że jesteś &lt;3</div>
      <div id="battery">🔋 --%</div>
    </div>

    <!-- PRAWY DOLNY -->
    <div class="today" id="today">
      Dziś
    </div>

    <div class="dot"></div>

  </div>


  <script>

    /* ZEGAR */

    function updateClock() {

      const now = new Date();

      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      const seconds = String(now.getSeconds()).padStart(2, "0");

      document.getElementById("hours").textContent = hours;
      document.getElementById("minutes").textContent = minutes;
      document.getElementById("seconds").textContent = seconds;


      const date = now.toLocaleDateString("pl-PL", {
        weekday: "long",
        day: "numeric",
        month: "long"
      });

      document.getElementById("date").textContent = date;


      const weekday = now.toLocaleDateString("pl-PL", {
        weekday: "long"
      });

      document.getElementById("today").textContent =
        "Dziś " + weekday;
    }


    updateClock();

    setInterval(updateClock, 1000);


    /* BATERIA */

    async function updateBattery() {

      try {

        if ("getBattery" in navigator) {

          const battery = await navigator.getBattery();

          function showBattery() {

            const level = Math.round(battery.level * 100);

            let icon = "🔋";

            if (battery.charging) {
              icon = "⚡";
            }

            document.getElementById("battery").textContent =
              icon + " " + level + "%";
          }

          showBattery();

          battery.addEventListener("levelchange", showBattery);
          battery.addEventListener("chargingchange", showBattery);

        } else {

          document.getElementById("battery").textContent =
            "🔋 bateria iPada";

        }

      } catch (error) {

        document.getElementById("battery").textContent =
          "🔋 bateria";

      }
    }

    updateBattery();


    /* POGODA */

    async function getWeather() {

      try {

        if (!navigator.geolocation) {
          throw new Error("Brak geolokalizacji");
        }

        navigator.geolocation.getCurrentPosition(

          async function(position) {

            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            const response = await fetch(
              "https://api.open-meteo.com/v1/forecast" +
              "?latitude=" + lat +
              "&longitude=" + lon +
              "&current=temperature_2m,weather_code" +
              "&timezone=auto"
            );

            const data = await response.json();

            const temp = Math.round(data.current.temperature_2m);

            const code = data.current.weather_code;

            let icon = "☁︎";
            let description = "pochmurno";

            if (code === 0) {
              icon = "☀︎";
              description = "bezchmurnie";
            }
            else if (code <= 3) {
              icon = "☁︎";
              description = "zachmurzenie";
            }
            else if (code <= 48) {
              icon = "🌫";
              description = "mgła";
            }
            else if (code <= 67) {
              icon = "☂︎";
              description = "deszcz";
            }
            else if (code <= 77) {
              icon = "❄︎";
              description = "śnieg";
            }
            else if (code <= 82) {
              icon = "☂︎";
              description = "przelotny deszcz";
            }
            else {
              icon = "⛈";
              description = "burza";
            }

            document.getElementById("weather-temp").textContent =
              icon + " " + temp + "°";

            document.getElementById("weather-text").textContent =
              description;
          },

          function() {

            document.getElementById("weather-temp").textContent =
              "☁︎ --°";

            document.getElementById("weather-text").textContent =
              "brak lokalizacji";

          }
        );

      } catch (error) {

        document.getElementById("weather-text").textContent =
          "pogoda niedostępna";

      }
    }

    getWeather();

  </script>

</body>
</html>
