  <title>Zegar iPad</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 45%,
          #3b2852 0%,
          #251735 45%,
          #100a18 100%
        );

      color: #ffffff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    .screen {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* GŁÓWNY ZEGAR */

    .center {
      position: absolute;
      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 100%;
      text-align: center;
    }

    #clock {
      font-size: 18vw;
      max-width: 95vw;

      font-weight: 200;

      letter-spacing: -3px;
      line-height: 1;

      font-variant-numeric: tabular-nums;

      white-space: nowrap;

      text-shadow:
        0 0 18px rgba(255, 255, 255, 0.06),
        0 0 45px rgba(190, 150, 220, 0.08);
    }

    #date {
      margin-top: 30px;

      text-align: center;

      font-size: 4vw;

      line-height: 1.2;

      font-weight: 300;

      letter-spacing: 0.5px;

      opacity: 0.68;
    }

    /* GÓRA LEWA */

    .quote {
      position: absolute;

      top: 5%;
      left: 4%;

      font-weight: 350;

      letter-spacing: 0.8px;

      opacity: 0.72;

      white-space: nowrap;
    }

    /* GÓRA PRAWA */

    .weather {
      position: absolute;

      top: 5%;
      right: 4%;

      font-weight: 350;

      letter-spacing: 0.8px;

      opacity: 0.72;

      white-space: nowrap;
    }

    .line {

      background: rgba(255, 255, 255, 0.13);
