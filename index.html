```html
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Zegar iPad</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
    }

    .screen {
      width: 100%;
      text-align: center;
      padding: 20px;
    }

    #clock {
  font-size: 18vw;
  max-width: 95vw;
  font-weight: 200;
  letter-spacing: -3px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

#date {
  margin-top: 30px;
  text-align: center;
  font-size: 4vw;
  line-height: 1.2;
  font-weight: 300;
  opacity: 0.75;
}

    .seconds {
      opacity: 0.35;
    }

    @media (orientation: portrait) {
      #clock {
        font-size: 16vw;
        letter-spacing: -3px;
      }

      #date {
        font-size: 4vw;
        margin-top: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="screen">
    <div id="clock">
      <span id="hours">00</span>:<span id="minutes">00</span><span class="seconds">:<span id="seconds">00</span></span>
    </div>

    <div id="date"></div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      const seconds = String(now.getSeconds()).padStart(2, "0");

      document.getElementById("hours").textContent = hours;
      document.getElementById("minutes").textContent = minutes;
      document.getElementById("seconds").textContent = seconds;

      const date = now.toLocaleDateString("pl-PL", {
        weekday: "long",
        day: "numeric",
        month: "long"
      });

      document.getElementById("date").textContent = date;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
